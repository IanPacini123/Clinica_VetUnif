services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vetunif}
      POSTGRES_USER: ${POSTGRES_USER:-vetunif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetunif}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "npm run db:deploy -w @clinica/api && npm run dev -w @clinica/api"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vetunif}:${POSTGRES_PASSWORD:-vetunif}@db:5432/${POSTGRES_DB:-vetunif}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -w @clinica/web -- --host 0.0.0.0
    environment:
      API_URL: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
