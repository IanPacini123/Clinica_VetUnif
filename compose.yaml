services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vetunif}
      POSTGRES_USER: ${POSTGRES_USER:-vetunif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetunif}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
